<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Z-Сбережения: Навигатор посильности</title>
  <!-- Подключаем стили stlite для корректного отображения интерфейса Streamlit -->
  <link rel="stylesheet" href="https://jsdelivr.net" />
</head>
<body>
  <div id="root"></div>

  <!-- Подключаем ядро stlite, которое запустит Python прямо в браузере -->
  <script src="https://jsdelivr.net"></script>
  <script>
    stlite.mount({
      requirements: [], // Вашему коду не нужны внешние библиотеки вроде pandas, достаточно чистого Streamlit
      entrypoint: "app.py",
      files: {
        "app.py": `
import streamlit as st

# Настройка страницы
st.set_page_config(
    page_title="Z-Сбережения: Навигатор посильности",
    page_icon="🏠",
    layout="centered"
)

# Заголовок программы
st.title("🏠 Z-Сбережения: Навигатор посильности")
st.caption("Экспресс-оценка кредитной нагрузки и выявление скрытого 'платёжного шока'")

st.divider()

# --- БЛОК 1: ВВОД ДАННЫХ ---
st.header("1. Ваши финансовые параметры")

col1, col2 = st.columns(2)

with col1:
    salary = st.number_input("Ваш чистый доход в месяц (BYN):", value=3468, step=100)
    has_partner = st.checkbox("Учитывать доход партнёра/супруга?")
    if has_partner:
        partner_salary = st.number_input("Чистый доход партнёра (BYN):", value=2500, step=100)
        total_income = salary + partner_salary
    else:
        total_income = salary

with col2:
    price = st.number_input("Стоимость квартиры (BYN):", value=229140, step=5000)
    down_payment_pct = st.slider("Первоначальный взнос (%):", min_value=10, max_value=50, value=10, step=5)

# Расчет суммы взноса и суммы кредита
down_payment = price * (down_payment_pct / 100)
credit_amount = price - down_payment

st.info(f"💰 **Сумма кредита:** {credit_amount:,.2f} BYN | **Взнос:** {down_payment:,.2f} BYN")

# --- БЛОК 2: ПАРАМЕТРЫ КРЕДИТА ---
st.header("2. Условия кредита")

promo = st.checkbox("Акционный кредит ('1% в первые 2 года')?", value=True)

if promo:
    rate_promo = 1.0  # Ставка в льготный период
    rate_main = 15.4  # Ставка со 2-го года
else:
    rate_main = st.number_input("Процентная ставка по кредиту (%):", value=14.1, step=0.1)
    rate_promo = rate_main

years = st.slider("Срок кредита (лет):", min_value=5, max_value=25, value=20)
months = years * 12

# --- БЛОК 3: РАСЧЕТ ПЛАТЕЖЕЙ ---
def calc_annuity(amount, annual_rate, period_months):
    if annual_rate == 0:
        return amount / period_months
    monthly_rate = (annual_rate / 100) / 12
    payment = amount * (monthly_rate * (1 + monthly_rate)**period_months) / ((1 + monthly_rate)**period_months - 1)
    return payment

if promo:
    payment_promo = (credit_amount * (rate_promo / 100)) / 12
    payment_main = calc_annuity(credit_amount, rate_main, months - 24)
else:
    payment_promo = calc_annuity(credit_amount, rate_main, months)
    payment_main = payment_promo

safe_limit = total_income * 0.40
dti_promo = (payment_promo / total_income) * 100
dti_main = (payment_main / total_income) * 100

st.divider()

# --- БЛОК 4: ВЕРДИКТ И «СВЕТОФОР» ---
st.header("3. Результат анализа посильности")

if promo:
    st.warning(f"⚡ **ВНИМАНИЕ! ВЫЯВЛЕН ПЛАТЁЖНЫЙ ШОК:**\\n"
               f"- Платёж (1–24 мес): **{payment_promo:,.2f} BYN/мес** ({dti_promo:.1f}% от дохода)\\n"
               f"- Платёж с 25-го месяца: **{payment_main:,.2f} BYN/мес** ({dti_main:.1f}% от дохода)\\n"
               f"- Скачок платежа: **в {payment_main/payment_promo:.1f} раз!**")
else:
    st.write(f"Ежемесячный платёж: **{payment_main:,.2f} BYN/мес** ({dti_main:.1f}% от дохода)")

if dti_main <= 40:
    st.success("🟢 **ЗЕЛЁНЫЙ СВЕТ:** Кредит посилен. Нагрузка не превышает 40% вашего чистого дохода.")
elif dti_main <= 60:
    st.warning("🟡 **ЖЁЛТЫЙ СВЕТ:** Высокий риск! Нагрузка превышает рекомендуемые 40%. Потребуется жесткая экономия.")
else:
    st.error("🔴 **КРАСНЫЙ СВЕТ (КРАХ БЮДЖЕТА):** Кредит непосилен! Платёж забирает большую часть вашего дохода.")

# --- БЛОК 5: ПРАВИЛО НАКОПИТЕЛЬНЫХ ЛЕТ ---
st.divider()
st.header("4. Альтернатива: Накопительные года")

saving_rate = 0.20
annual_savings = total_income * saving_rate * 12
accum_years = price / annual_savings

st.write(f"Если вы решите копить (откладывая 20% дохода = **{total_income * saving_rate:,.2f} BYN/мес**):")
st.metric(label="Правило накопительных лет (до покупки 100% жилья)", value=f"{accum_years:.1f} лет")

st.caption("Разработчики: Команда исследования Нацбанка РБ | Проект 'Z-Сбережения'")
`
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
