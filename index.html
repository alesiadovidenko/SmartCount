<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCount — Навигатор посильности</title>

  <!-- Подключаем стильный шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
      --panel-bg: rgba(255, 255, 255, 0.03);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f0ff;
      --text-muted: #a5a1b8;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 16px;
      --transition: 0.25s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 40px 36px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, var(--accent-hover));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 400;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input[type="number"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    select option {
      background: #15102a;
      color: var(--text-main);
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    button:hover {
      background: linear-gradient(135deg, var(--accent-hover), var(--accent));
      transform: translateY(-2px);
      box-shadow: 0 12px 32px var(--accent-glow);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 28px;
      padding: 22px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
    }

    .result.visible {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .result strong {
      color: var(--accent-hover);
    }

    .result.success { border-color: var(--success); }
    .result.warning { border-color: var(--warning); }
    .result.danger  { border-color: var(--danger); }

    @media (max-width: 480px) {
      .container { padding: 28px 22px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SmartCount</h1>
    <p class="subtitle">Навигатор посильности — оцените свои силы перед следующей дозой</p>

    <div class="field">
      <label for="weight">Вес тела (кг)</label>
      <input type="number" id="weight" placeholder="Например, 70" min="30" max="250" step="0.5">
    </div>

    <div class="field">
      <label for="lastDose">Время с последней дозы (часы)</label>
      <input type="number" id="lastDose" placeholder="Например, 4" min="0" step="0.5">
    </div>

    <div class="field">
      <label for="substance">Вещество</label>
      <select id="substance">
        <option value="caffeine">Кофеин</option>
        <option value="alcohol">Алкоголь</option>
        <option value="nicotine">Никотин</option>
      </select>
    </div>

    <button id="calcBtn">Рассчитать</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const calcBtn = document.getElementById('calcBtn');
    const resultEl = document.getElementById('result');

    calcBtn.addEventListener('click', () => {
      const weight = parseFloat(document.getElementById('weight').value);
      const hours = parseFloat(document.getElementById('lastDose').value);
      const substance = document.getElementById('substance').value;

      if (isNaN(weight) || isNaN(hours) || weight <= 0 || hours < 0) {
        resultEl.className = 'result visible danger';
        resultEl.innerHTML = '⚠️ Пожалуйста, введите корректные значения веса и времени.';
        return;
      }

      // Условные коэффициенты выведения (для демонстрации логики)
      const halfLife = {
        caffeine: 5,
        alcohol: 4,
        nicotine: 2
      };

      const remaining = 50 * Math.pow(0.5, hours / halfLife[substance]);
      const perKg = remaining / weight;

      let level = 'success';
      let verdict = 'Безопасно';

      if (perKg > 1.2) {
        level = 'danger';
        verdict = 'Высокая нагрузка — лучше подождать';
      } else if (perKg > 0.6) {
        level = 'warning';
        verdict = 'Умеренная нагрузка — соблюдайте осторожность';
      }

      resultEl.className = `result visible ${level}`;
      resultEl.innerHTML = `
        Остаточное количество: <strong>${remaining.toFixed(1)}</strong> усл. ед.<br>
        На килограмм веса: <strong>${perKg.toFixed(3)}</strong> усл. ед./кг<br>
        Вердикт: <strong>${verdict}</strong>
      `;
    });
  </script>
</body>
</html>
